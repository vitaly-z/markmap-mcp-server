name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) + provenance
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, required for OIDC trusted publishing
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Check package version matches release
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          GITHUB_REF_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$GITHUB_REF_VERSION" ]; then
            echo "::error::Package version ($PKG_VERSION) does not match release tag ($GITHUB_REF_VERSION)"
            exit 1
          fi
      # No NODE_AUTH_TOKEN: npm uses GitHub OIDC via Trusted Publisher.
      # Provenance is generated automatically with trusted publishing.
      - name: Publish to NPM
        run: npm publish --access public
